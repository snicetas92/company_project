<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Компания</title>
    <!-- Подключаем Bootstrap для красивого оформления -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<header class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}">Наша Компания</a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'employee_list' %}active{% endif %}" 
             href="{% url 'employee_list' %}">Список сотрудников</a>
        </li>
      </ul>

      <!-- Блок для авторизованных пользователей -->
      {% if user.is_authenticated %}
        <span class="navbar-text me-3">
          Здравствуйте, <strong>{{ user.get_full_name|default:user.username }}</strong>!
        </span>
        
        <!-- Кнопка "Профиль" -->
        <a href="{% url 'profile' %}" class="btn btn-outline-primary btn-sm me-2">Профиль</a>
        
        <!-- Кнопка "Выйти" (Форма) -->
        <form action="{% url 'logout' %}" method="post" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-danger btn-sm">Выйти</button>
        </form>

      {% else %}
        <!-- Блок для неавторизованных пользователей -->
        <a href="{% url 'login' %}" class="btn btn-outline-success btn-sm">Войти</a>
      {% endif %}
    </div>
  </div>
</header>

<div class="container">
  <main role="main" class="py-4">
    {% block content %}
    {% endblock %}
  </main>
</div>

<!-- Подключаем Bootstrap JS (необязательно, но для выпадающего меню) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
