{% extends "base.html" %}

{% block content %}
  <h2>Профиль пользователя: {{ user.get_full_name }}</h2>
  
  <div class="row">
    <div class="col-md-6">
      <p><strong>Имя:</strong> {{ user.first_name }}</p>
      <p><strong>Фамилия:</strong> {{ user.last_name }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>Пол:</strong> {{ user.get_gender_display }}</p>
    </div>
  </div>

  <a href="{% url 'employee_list' %}" class="btn btn-secondary mt-4">Вернуться к списку</a>
{% endblock %}
